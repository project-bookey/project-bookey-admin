name: Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: bookey-admin-production-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  EC2_APP_DIR: ${{ vars.EC2_APP_DIR || '/opt/bookey' }}
  NEXT_PUBLIC_ADMIN_API_URL: ${{ vars.NEXT_PUBLIC_ADMIN_API_URL || 'https://api.bookey.site' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}
      EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
    steps:
      - uses: actions/checkout@v5
      - name: Configure SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/bookey-ec2.pem
          chmod 600 ~/.ssh/bookey-ec2.pem
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts
      - name: Package and upload source
        run: |
          set -euo pipefail
          tar --exclude='.git' --exclude='node_modules' --exclude='.next' --exclude='.env*' --exclude='dist' -czf "/tmp/bookey-admin-${GITHUB_RUN_ID}.tgz" .
          scp -i ~/.ssh/bookey-ec2.pem "/tmp/bookey-admin-${GITHUB_RUN_ID}.tgz" "${EC2_USER}@${EC2_HOST}:/tmp/bookey-admin-${GITHUB_RUN_ID}.tgz"
      - name: Deploy admin
        run: |
          ssh -i ~/.ssh/bookey-ec2.pem "${EC2_USER}@${EC2_HOST}" "EC2_APP_DIR='${EC2_APP_DIR}' RELEASE_ID='${GITHUB_RUN_ID}' ADMIN_API_URL='${NEXT_PUBLIC_ADMIN_API_URL}' bash -s" <<'REMOTE'
          set -euo pipefail
          APP_DIR="${EC2_APP_DIR:-/opt/bookey}"
          BACKUP_DIR="${APP_DIR}/backups/admin-${RELEASE_ID}"
          SOURCE_DIR="${APP_DIR}/project-bookey-admin/project-bookey"
          ARCHIVE="/tmp/bookey-admin-${RELEASE_ID}.tgz"
          sudo mkdir -p "$BACKUP_DIR"
          OLD_IMAGE=$(docker inspect bookey-admin-1 --format '{{.Image}}')
          docker tag "$OLD_IMAGE" "bookey-admin:rollback-${RELEASE_ID}"
          sudo mv "$SOURCE_DIR" "$BACKUP_DIR/source"
          sudo mkdir -p "$SOURCE_DIR"
          sudo tar -xzf "$ARCHIVE" -C "$SOURCE_DIR"
          sudo chown -R "$(id -u):$(id -g)" "$SOURCE_DIR"
          rollback() {
            docker tag "bookey-admin:rollback-${RELEASE_ID}" bookey-admin:latest
            cd "$APP_DIR"
            docker compose up -d --no-deps --no-build admin
            sudo mv "$SOURCE_DIR" "$BACKUP_DIR/failed-source"
            sudo mv "$BACKUP_DIR/source" "$SOURCE_DIR"
          }
          trap 'rollback' ERR
          cd "$APP_DIR"
          docker compose build --build-arg "NEXT_PUBLIC_ADMIN_API_URL=${ADMIN_API_URL}" admin
          docker compose up -d --no-deps admin
          ready=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3100/login >/dev/null; then
              ready=true
              break
            fi
            sleep 5
          done
          "$ready"
          trap - ERR
          printf '%s\n' "$RELEASE_ID" > "$SOURCE_DIR/DEPLOYED_RELEASE"
          REMOTE
      - name: Check public HTTPS login
        run: curl --fail --retry 6 --retry-delay 5 https://admin.bookey.site/login -o /dev/null
